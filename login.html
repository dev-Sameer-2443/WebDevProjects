<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;

      /* Background image */
      background: url("library.jpg") no-repeat center center fixed;
      background-size: cover;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Dark overlay for readability */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .login-box {
      position: relative;
      z-index: 2;

      width: 350px;
      padding: 30px;
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);

      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.4);
      color: white;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
    }

    label {
      font-size: 14px;
      display: block;
      margin: 10px 0 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;

      border: none;
      border-radius: 8px;

      background: #00c853;
      color: white;
      font-size: 16px;
      cursor: pointer;

      transition: transform 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      background: #00a844;
    }

    .footer-text {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="login-box">
    <h2>Library Login</h2>

    <form>
      <label>Username</label>
      <input type="text" placeholder="Enter your username" required>

      <label>Password</label>
      <input type="password" placeholder="Enter your password" required>

      <button type="submit">Login</button>

      <div class="footer-text">
        Welcome to the Library Portal 📚
      </div>
    </form>
  </div>

</body>
</html>
